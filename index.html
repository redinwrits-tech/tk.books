<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TK Books</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9f9f9;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    header {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    .tagline {
      font-size: 1.2rem;
      color: #666;
      margin-bottom: 2rem;
    }
    .book-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
      max-width: 600px;
    }
    .book {
      background: #fff;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .book-title {
      font-size: 1.4rem;
      font-weight: bold;
    }
    .book-desc {
      font-size: 1rem;
      color: #555;
    }
  </style>
</head>
<body>
  <header>TK Books</header>
  <div class="tagline">Stories that reshape imagination.</div>

  <div class="book-list">
    <div class="book">
      <div class="book-title">The Original Eagle-Way</div>
      <div class="book-desc">A 300+ page journey into TG’s world — bold, visionary, and unforgettable.</div>
    </div>
    <div class="book">
      <div class="book-title">Wanna Be Eaten? Pt.1</div>
      <div class="book-desc">150+ pages of slapstick, surrealism, and friendship-driven chaos.</div>
    </div>
  </div>
</body>
</html>
